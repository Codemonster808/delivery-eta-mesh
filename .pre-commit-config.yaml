repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        exclude: ^src/worker/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files

# Note: the Java worker (src/worker/, Maven) is intentionally NOT wired into
# pre-commit — Maven startup cost makes it impractical as a local git hook.
# Java formatting/verification is enforced in CI instead (see .github/workflows/ci.yml).
