services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "${MINISTACK_PORT:-4584}:4566"
    environment:
      - SERVICES=s3,sns,sqs,dynamodb,ec2,ecs,ecr
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"   # ECS launches real containers for the worker task
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 5s
      timeout: 5s
      retries: 10
