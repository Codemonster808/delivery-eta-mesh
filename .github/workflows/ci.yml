name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:latest
        ports: ["4566:4566"]
    env:
      LLM_PROVIDER: fake
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt
      - run: cd src/worker && ./mvnw -q test
      - run: cd src/worker && ./mvnw -q package -DskipTests
      - run: python3 scripts/bootstrap.py
      - run: pytest tests/ features/ -v --ignore=tests/data_quality --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=42
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip-audit -r requirements.txt
      # Filesystem scan of the Maven worker. The worker's own code is tiny;
      # the supply-chain surface is the transitive tree (~52 compile/runtime
      # artifacts). See docs/adr/0004-maven-dependency-scanning.md.
      # Resolve deps into ~/.m2 first: Trivy walks POMs via Maven Central and
      # uncached scans get IP-blocked (HTTP 429) mid-tree.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: cd src/worker && ./mvnw -q dependency:resolve -DskipTests
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: src/worker
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"

  e2e:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:latest
        ports: ["4566:4566"]
    env:
      LLM_PROVIDER: fake
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt
      - run: cd src/worker && ./mvnw -q package -DskipTests
      - run: python3 scripts/bootstrap.py
      - run: pytest tests/data_quality -v -s
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            benchmarks/quality-report.json
            docs/quality-report.md
